# Configuration for `prek` (https://prek.j178.dev), run before every commit and by `scripts/push` before every push.
# Schema: https://www.schemastore.org/prek.json
minimum_prek_version = "0.3.11"
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit", "manual"]

# Hooks run cheapest first and the run stops at the first failure, so a commit
# that is already going to be rejected never pays for a full test run.
fail_fast = true

# Vendored, minified files are not ours to reformat.
exclude = '\.min\.(css|js)$'

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "check-merge-conflict" },
    # The logo renders ship as PNGs alongside their SVG sources, and the largest is 567 KB.
    { id = "check-added-large-files", args = ["--maxkb=1024"] },
    { id = "detect-private-key" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-case-conflict" },
    { id = "destroyed-symlinks" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "verified-push"
name = "verified prek push"
entry = "scripts/check-push"
language = "system"
stages = ["pre-push"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "audit"
name = "cargo audit"
entry = "cargo audit --deny yanked"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all -- --check"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "lint"
name = "cargo clippy"
entry = "scripts/lint"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "migrate"
name = "SQLx migrations"
entry = "scripts/migrate"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "dashboard-js-test"
name = "dashboard JavaScript tests"
entry = "node --test ironqueue/tests/dashboard/app.test.mjs"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "test"
name = "cargo test"
entry = "scripts/test"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "msrv"
name = "minimum supported Rust version"
entry = "cargo +1.95.0 check --locked --workspace --all-targets --all-features"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "queue-only"
name = "queue-only feature set"
entry = "cargo check --locked -p ironqueue --lib --bins --no-default-features"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "stress"
name = "stress tests"
entry = "scripts/stress"
language = "system"
always_run = true
pass_filenames = false
