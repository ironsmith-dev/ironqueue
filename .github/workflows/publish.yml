name: publish

run-name: Publish v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version (x.y.z)
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

env:
  DATABASE_URL: postgres://ironqueue:ironqueue@localhost:5439/ironqueue
  VERSION: ${{ inputs.version }}

jobs:
  publish-crates:
    name: Publish Crates
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/publish --check "$VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
              echo "tag v$VERSION already exists" >&2
              exit 1
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install dev tools
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov@0.8.7,prek@0.4.13,sqlx-cli@0.9.0

      - name: Run pre-commit hooks
        run: prek run --all-files

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: scripts/publish "$VERSION"

      - name: Tag the commit and publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
